[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-ai-lab"
version = "0.1.0"
description = "Educational finance + AI lab with a deterministic market watcher."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
market-watcher = "market_watcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
